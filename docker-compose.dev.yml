services:
    omegaweb-next:
        extends:
            file: docker-compose.base.yml
            service: omegaweb-next
        build:
            target: dev
        ports:
            - 80:3000
            - 3000:3000
        volumes:
            - ${PROJECT_ROOT:-.}/src:/usr/src/app/src
            - ${PROJECT_ROOT:-.}/package.json:/usr/src/app/package.json
            - ${PROJECT_ROOT:-.}/package-lock.json:/usr/src/app/package-lock.json
            - ${PROJECT_ROOT:-.}/logs:/usr/src/app/logs
            - devstore:/usr/src/app/store
            - dotnext:/usr/src/app/.next

    worker:
        extends:
            file: docker-compose.base.yml
            service: omegaweb-next
        build:
            target: dev
        command: ["./node_modules/.bin/tsx", "src/workers/main.ts"]
        environment:
            IGNORE_SERVER_ONLY: 'true'
        volumes:
            - ${PROJECT_ROOT:-.}/src:/usr/src/app/src
            - ${PROJECT_ROOT:-.}/package.json:/usr/src/app/package.json
            - ${PROJECT_ROOT:-.}/package-lock.json:/usr/src/app/package-lock.json
            - ${PROJECT_ROOT:-.}/logs:/usr/src/app/logs
            - devstore:/usr/src/app/store

    db:
        extends:
            file: docker-compose.base.yml
            service: db
        ports:
            - 5432:5432
        volumes:
            - devdb:/var/lib/postgresql/data

    stripe:
        image: stripe/stripe-cli:v1.37.3
        command: listen --forward-to http://omegaweb-next:3000/api/stripe-events --skip-verify
        environment:
            STRIPE_API_KEY: ${STRIPE_SECRET_KEY} 

volumes:
    devdb:
        driver: local
    devstore:
        driver: local
    dotnext:
        driver: local
