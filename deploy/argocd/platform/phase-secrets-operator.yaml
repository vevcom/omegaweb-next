# Syncs secrets from Phase into Kubernetes secrets, see the PhaseSecret in overlays/prod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: phase-secrets-operator
    namespace: argocd
    annotations:
        argocd.argoproj.io/sync-wave: "-1"
spec:
    project: default
    source:
        repoURL: https://helm.phase.dev
        chart: phase-kubernetes-operator
        targetRevision: 2.0.2
        helm:
            valuesObject: { image: { tag: v2.0.2 } }
    destination:
        server: https://kubernetes.default.svc
        namespace: phase-system
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
