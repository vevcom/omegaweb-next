apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: root
    namespace: argocd
    annotations:
        argocd.argoproj.io/sync-wave: "0"
spec:
    project: default
    source:
        repoURL: https://github.com/vevcom/project-next.git
        path: deploy/argocd/prod
        targetRevision: main
    destination:
        server: https://kubernetes.default.svc
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        # The first sync of a fresh cluster runs before the operators' CRDs exist.
        retry:
            limit: 10
            backoff:
                duration: 30s
                maxDuration: 5m
