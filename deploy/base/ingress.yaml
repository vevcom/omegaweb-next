apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: omegaweb-next
spec:
    rules:
        - host: placeholder.invalid
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: omegaweb-next
                            port:
                                name: http
