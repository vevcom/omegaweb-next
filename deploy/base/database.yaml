# CloudNativePG creates the omegaweb-next-db-app secret, whose `uri` key every pod
# reads as DB_URI.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
    name: omegaweb-next-db
    annotations:
        argocd.argoproj.io/sync-wave: "-3"
spec:
    instances: 1
    imageName: ghcr.io/cloudnative-pg/postgresql:16.6
    bootstrap:
        initdb:
            database: omegaweb
            owner: omegaweb
    storage:
        size: 10Gi
