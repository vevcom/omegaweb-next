apiVersion: apps/v1
kind: Deployment
metadata:
    name: projectnext
spec:
    replicas: 2
    strategy:
        rollingUpdate:
            maxUnavailable: 0
    selector:
        matchLabels:
            app.kubernetes.io/name: projectnext
    template:
        metadata:
            labels:
                app.kubernetes.io/name: projectnext
        spec:
            containers:
                - name: projectnext
                  image: projectnext
                  ports:
                      - name: http
                        containerPort: 3000
                  envFrom:
                      - secretRef:
                            name: projectnext-env
                      - configMapRef:
                            name: projectnext-config
                  env:
                      - name: DB_URI
                        valueFrom:
                            secretKeyRef:
                                name: projectnext-db-app
                                key: uri
                  startupProbe:
                      httpGet:
                          path: /api/health
                          port: http
                      periodSeconds: 5
                      failureThreshold: 24
                  readinessProbe:
                      httpGet:
                          path: /api/health
                          port: http
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /api/health
                          port: http
                      periodSeconds: 20
                      failureThreshold: 3
                  resources:
                      requests:
                          cpu: 100m
                          memory: 384Mi
                      limits:
                          memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
    name: projectnext
spec:
    selector:
        app.kubernetes.io/name: projectnext
    ports:
        - name: http
          port: 80
          targetPort: http
