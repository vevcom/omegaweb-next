apiVersion: apps/v1
kind: Deployment
metadata:
    name: omegaweb-next
spec:
    replicas: 2
    strategy:
        rollingUpdate:
            maxUnavailable: 0
    selector:
        matchLabels:
            app.kubernetes.io/name: omegaweb-next
    template:
        metadata:
            labels:
                app.kubernetes.io/name: omegaweb-next
        spec:
            volumes:
                - name: sites
                  configMap:
                      name: omegaweb-next-sites
            containers:
                - name: omegaweb-next
                  image: omegaweb-next
                  ports:
                      - name: http
                        containerPort: 3000
                  envFrom:
                      - secretRef:
                            name: omegaweb-next-env
                      - configMapRef:
                            name: omegaweb-next-config
                  volumeMounts:
                      - name: sites
                        mountPath: /etc/omegaweb-next
                        readOnly: true
                  env:
                      - name: DB_URI
                        valueFrom:
                            secretKeyRef:
                                name: omegaweb-next-db-app
                                key: uri
                  startupProbe:
                      httpGet:
                          path: /api/health
                          port: http
                      periodSeconds: 5
                      failureThreshold: 24
                  readinessProbe:
                      httpGet:
                          path: /api/health
                          port: http
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /api/health
                          port: http
                      periodSeconds: 20
                      failureThreshold: 3
                  resources:
                      requests:
                          cpu: 100m
                          memory: 384Mi
                      limits:
                          memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
    name: omegaweb-next
spec:
    selector:
        app.kubernetes.io/name: omegaweb-next
    ports:
        - name: http
          port: 80
          targetPort: http
