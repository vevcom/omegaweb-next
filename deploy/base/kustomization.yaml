apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
    - pairs:
          app.kubernetes.io/part-of: projectnext

resources:
    - database.yaml
    - migrate-job.yaml
    - app.yaml
    - worker.yaml
    - ingress.yaml

# Non-secret settings. Listed after the env secret in every envFrom, so a key here
# wins over the same key in the secret.
configMapGenerator:
    - name: projectnext-config
      # The migrate job in wave -1 reads it too.
      options:
          annotations:
              argocd.argoproj.io/sync-wave: "-3"
      literals:
          - LOG_TO_CONSOLE=true
          - LOG_CONSOLE_LEVEL=info
          - LOG_TO_FILE=false
          - LOG_TO_FOLDER=false
          - HOSTNAME=0.0.0.0
