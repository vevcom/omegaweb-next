apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
    - pairs:
          app.kubernetes.io/part-of: omegaweb-next

resources:
    - database.yaml
    - migrate-job.yaml
    - app.yaml
    - worker.yaml
    - ingress.yaml

# Non-secret settings. Listed after the env secret in every envFrom, so a key here
# wins over the same key in the secret.
configMapGenerator:
    - name: omegaweb-next-config
      # The migrate job in wave -1 reads it too.
      options:
          annotations:
              argocd.argoproj.io/sync-wave: "-3"
      literals:
          - LOG_TO_CONSOLE=true
          - LOG_CONSOLE_LEVEL=info
          - LOG_TO_FILE=false
          - LOG_TO_FOLDER=false
          - HOSTNAME=0.0.0.0
          # NextAuth serves every domain in sites.json on its own, so NEXTAUTH_URL stays unset.
          - AUTH_TRUST_HOST=true
          # Each overlay generates the omegaweb-next-sites ConfigMap this comes from.
          - SITES_CONFIG=/etc/omegaweb-next/sites.json
    # Only exists to carry POSTGRES_IMAGE from postgres.env into the replacement below.
    # local-config keeps it out of the cluster.
    - name: postgres
      envs:
          - postgres.env
      options:
          disableNameSuffixHash: true
          annotations:
              config.kubernetes.io/local-config: "true"

replacements:
    - source:
          kind: ConfigMap
          name: postgres
          fieldPath: data.POSTGRES_IMAGE
      targets:
          - select:
                kind: Cluster
                name: omegaweb-next-db
            fieldPaths:
                - spec.imageName
