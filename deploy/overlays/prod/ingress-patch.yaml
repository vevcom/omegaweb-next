apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: projectnext
    annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        traefik.ingress.kubernetes.io/router.middlewares: projectnext-redirect-https@kubernetescrd
spec:
    tls:
        - hosts: [sctomega.com]
          secretName: projectnext-tls
    rules:
        - host: sctomega.com
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: projectnext
                            port:
                                name: http
