apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: omegaweb-next
    annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        traefik.ingress.kubernetes.io/router.middlewares: omegaweb-next-redirect-https@kubernetescrd
# Every host in sites.json, aliases included, since the app sends aliases on itself.
spec:
    tls:
        - hosts:
              - omega.ntnu.no
              - www.omega.ntnu.no
              - contactor.omega.ntnu.no
              - www.contactor.omega.ntnu.no
              - revyen.omega.ntnu.no
              - www.revyen.omega.ntnu.no
          secretName: omegaweb-next-tls
    rules:
        - host: omega.ntnu.no
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: omegaweb-next
                            port:
                                name: http
        - host: www.omega.ntnu.no
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: omegaweb-next
                            port:
                                name: http
        - host: contactor.omega.ntnu.no
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: omegaweb-next
                            port:
                                name: http
        - host: www.contactor.omega.ntnu.no
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: omegaweb-next
                            port:
                                name: http
        - host: revyen.omega.ntnu.no
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: omegaweb-next
                            port:
                                name: http
        - host: www.revyen.omega.ntnu.no
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: omegaweb-next
                            port:
                                name: http
