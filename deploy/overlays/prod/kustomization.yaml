apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omegaweb-next

resources:
    - namespace.yaml
    - ../../base
    - database-backup.yaml
    - phase-secret.yaml
    - redirect-https.yaml

configMapGenerator:
    - name: omegaweb-next-sites
      files:
          - sites.json
      # The migrate job in wave -1 mounts it too.
      options:
          annotations:
              argocd.argoproj.io/sync-wave: "-3"
    - name: omegaweb-next-config
      behavior: merge
      literals:
          # The store keys, STORE_S3_ACCESS_KEY_ID and STORE_S3_SECRET_ACCESS_KEY, come from Phase.
          - STORE_S3_ENDPOINT=https://s3.trd1.stack.it.ntnu.no
          - STORE_S3_BUCKET=argo-prod-bucket

# The tags are bumped by .github/workflows/release.yml through a pull request.
images:
    - name: omegaweb-next
      newName: ghcr.io/vevcom/omegaweb-next
      newTag: v0.0.0
    - name: omegaweb-next-tools
      newName: ghcr.io/vevcom/omegaweb-next-tools
      newTag: v0.0.0

patches:
    - path: ingress-patch.yaml
    - path: database-patch.yaml
    # The images are private because the build bakes in NEXT_SERVER_ACTIONS_ENCRYPTION_KEY.
    # ghcr-pull is created by hand, like phase-service-token.
    - target:
          kind: (Deployment|Job)
      patch: |-
          - op: add
            path: /spec/template/spec/imagePullSecrets
            value:
                - name: ghcr-pull
