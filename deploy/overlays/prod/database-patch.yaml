# TODO: point backups at object storage and create the credentials secret before
# relying on this cluster. Without them a lost disk loses the database.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
    name: projectnext-db
spec:
    storage:
        size: 20Gi
    backup:
        retentionPolicy: 30d
        barmanObjectStore:
            destinationPath: s3://CHANGE-ME/projectnext-db
            endpointURL: https://CHANGE-ME
            s3Credentials:
                accessKeyId:
                    name: projectnext-db-backup
                    key: ACCESS_KEY_ID
                secretAccessKey:
                    name: projectnext-db-backup
                    key: SECRET_ACCESS_KEY
