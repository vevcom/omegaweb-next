# The operator writes the app's environment from Phase into omegaweb-next-env and keeps it
# in sync. It logs in with phase-service-token, the one secret created by hand, see
# deploy/README.md. The app is not restarted on a change, since Argo CD would revert the
# operator's edit to the Deployment, so a changed secret needs a rollout restart.
apiVersion: secrets.phase.dev/v1alpha1
kind: PhaseSecret
metadata:
    name: omegaweb-next-env
    annotations:
        argocd.argoproj.io/sync-wave: "-3"
spec:
    phaseAppId: d7a0b056-c45f-427e-b833-994ad10b2d49
    phaseAppEnv: production
    phaseAppEnvPath: /
    phaseHost: https://console.phase.dev
    pollingInterval: 60
    authentication:
        serviceToken:
            serviceTokenSecretReference:
                secretName: phase-service-token
                secretNamespace: omegaweb-next
    managedSecretReferences:
        - secretName: omegaweb-next-env
          secretNamespace: omegaweb-next
          secretType: Opaque
