# For a k3d cluster on a workstation. The images are built locally and imported
# with `k3d image import`, and the omegaweb-next-env secret is created by hand from
# a .env file, see deploy/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omegaweb-next

resources:
    - namespace.yaml
    - ../../base
    - store-pvc.yaml

configMapGenerator:
    - name: omegaweb-next-config
      behavior: merge
      literals:
          - WEBSITE_URL=http://omegaweb-next.localhost:8080
          - NEXTAUTH_URL=http://omegaweb-next.localhost:8080

images:
    - name: omegaweb-next
      newName: ghcr.io/vevcom/omegaweb-next
      newTag: local
    - name: omegaweb-next-tools
      newName: ghcr.io/vevcom/omegaweb-next-tools
      newTag: local

replicas:
    - name: omegaweb-next
      count: 2

patches:
    - target:
          kind: Ingress
          name: omegaweb-next
      patch: |-
          - op: replace
            path: /spec/rules/0/host
            value: omegaweb-next.localhost
    - target:
          kind: (Deployment|Job)
      patch: |-
          - op: add
            path: /spec/template/spec/volumes
            value:
                - name: store
                  persistentVolumeClaim:
                      claimName: omegaweb-next-store
          - op: add
            path: /spec/template/spec/containers/0/volumeMounts
            value:
                - name: store
                  mountPath: /usr/src/app/store
