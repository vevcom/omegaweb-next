# The services dev, test and prod share, extended in the environment-specific files. The health
# check of the app is the image's, see the Dockerfile.

services:
    omegaweb-next:
        build:
            context: ${PROJECT_ROOT:-.}/
            dockerfile: ${PROJECT_ROOT:-.}/Dockerfile
            args:
                NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY}
                NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        # The variables of .env.default, with .env's values over them, so the list of what the app
        # reads lives in .env.default alone. A service that needs more adds an environment: of its own.
        env_file:
            - path: ${PROJECT_ROOT:-.}/.env.default
              required: true
            - path: ${PROJECT_ROOT:-.}/.env
              required: false
        depends_on:
            db:
                condition: service_healthy
                required: false

    db:
        # The version lives in deploy/base/postgres.env, which every compose command is given.
        image: postgres:${POSTGRES_VERSION:?pass --env-file deploy/base/postgres.env}-alpine
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "sh -c 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}'"
                ]
            interval: 0.5s
            timeout: 0.5s
            retries: 60
