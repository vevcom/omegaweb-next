name: projectnext-prod

services:
    projectnext:
        extends:
            file: docker-compose.base.yml
            service: projectnext
        build:
            target: prod
        networks:
            - dokploy-network
        volumes:
            - store:/usr/src/app/store
            - logs:/usr/src/app/logs
            - dobbelOmegaManifest:/usr/src/app/dobbelOmegaManifest
        deploy:
            replicas: 2
        restart: always
        depends_on:
            migrate:
                condition: service_completed_successfully

    # Applies committed migrations, upserts the standard content (see seed.ts), then exits.
    # The seed only ever creates what is missing and refreshes what users cannot edit, so it is
    # safe - and meant - to run on every deploy.
    migrate:
        extends:
            file: docker-compose.base.yml
            service: projectnext
        build:
            target: tools
        command: ["npm", "run", "migrate:deploy-and-seed"]
        environment:
            # seed.ts runs DobbelOmega - a full import on top of the database - whenever this is
            # 'true'. A value left in the stack env from an import must never do that on every deploy.
            MIGRATE_FROM_OW: 'false'
        healthcheck:
            disable: true
        networks:
            - dokploy-network
        # The seeder writes the standard images' files to the store, which the app serves them from.
        volumes:
            - store:/usr/src/app/store
            - logs:/usr/src/app/logs
        restart: "no"

    imageworker:
        extends:
            file: docker-compose.base.yml
            service: projectnext
        build:
            target: tools
        command: ["./node_modules/.bin/tsx", "src/lib/images/worker.ts"]
        environment:
            IGNORE_SERVER_ONLY: 'true'
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f \"[i]mages/worker.ts\" > /dev/null"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 15s
        networks:
            - dokploy-network
        volumes:
            - store:/usr/src/app/store
            - logs:/usr/src/app/logs
        deploy:
            replicas: 1
        restart: always
        depends_on:
            migrate:
                condition: service_completed_successfully

    # Sends the weekly notification digest emails. Must stay at 1 replica - the digest run is
    # only guarded against repeats by its date cutoff, not against concurrent senders.
    notificationworker:
        extends:
            file: docker-compose.base.yml
            service: projectnext
        build:
            target: tools
        command: ["./node_modules/.bin/tsx", "src/lib/notifications/worker.ts"]
        environment:
            IGNORE_SERVER_ONLY: 'true'
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f \"[n]otifications/worker.ts\" > /dev/null"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 15s
        networks:
            - dokploy-network
        volumes:
            - logs:/usr/src/app/logs
        deploy:
            replicas: 1
        restart: always
        depends_on:
            migrate:
                condition: service_completed_successfully

    # One-shot, never started with the stack. The migration/seed toolchain needs the
    # full dependency tree (see the tools stage in the Dockerfile), so it ships as its
    # own image and is run on demand:
    #
    #   docker compose -f docker-compose.prod.yml --profile tools run --rm tools
    #
    # The default command is DobbelOmega, which resets the whole database.
    tools:
        extends:
            file: docker-compose.base.yml
            service: projectnext
        build:
            target: tools
        profiles:
            - tools
        healthcheck:
            disable: true
        networks:
            - dokploy-network
        volumes:
            - store:/usr/src/app/store
            - logs:/usr/src/app/logs
            - dobbelOmegaManifest:/usr/src/app/dobbelOmegaManifest
        restart: "no"

    # Local database for github actions.
    db:
        extends:
            file: docker-compose.base.yml
            service: db
        profiles:
            - localdb
        networks:
            - dokploy-network
        restart: always
        volumes:
            - proddb:/var/lib/postgresql/data

networks:
    dokploy-network:
        external: true

volumes:
    proddb:
        driver: local
    store:
        driver: local
    logs:
        driver: local
    dobbelOmegaManifest:
        driver: local
