# Kept from before the rename to Omegaweb Next: the store and logs volumes are named after it.
name: projectnext-prod

services:
    omegaweb-next:
        extends:
            file: docker-compose.base.yml
            service: omegaweb-next
        build:
            target: prod
        networks:
            - dokploy-network
        volumes:
            - store:/usr/src/app/store
            - logs:/usr/src/app/logs
            - dobbelOmegaManifest:/usr/src/app/dobbelOmegaManifest
        deploy:
            replicas: 2
        restart: always
        depends_on:
            migrate:
                condition: service_completed_successfully

    # Applies committed migrations, upserts the standard content (see seed.ts), then exits.
    # The seed only ever creates what is missing and refreshes what users cannot edit, so it is
    # safe - and meant - to run on every deploy.
    migrate:
        extends:
            file: docker-compose.base.yml
            service: omegaweb-next
        build:
            target: tools
        command: ["npm", "run", "migrate:deploy-and-seed"]
        healthcheck:
            disable: true
        networks:
            - dokploy-network
        # The seeder writes the standard images' files to the store, which the app serves them from.
        volumes:
            - store:/usr/src/app/store
            - logs:/usr/src/app/logs
        restart: "no"

    # Runs every background worker in one process: image processing, notification sending, payment
    # completion, the store's orphan destroyer and the ledger sweeper (src/workers/main.ts). Must stay
    # at 1 replica - the weekly digest is only guarded against repeats by its date cutoff, not against
    # concurrent senders.
    worker:
        extends:
            file: docker-compose.base.yml
            service: omegaweb-next
        build:
            target: tools
        command: ["./node_modules/.bin/tsx", "src/workers/main.ts"]
        environment:
            IGNORE_SERVER_ONLY: 'true'
        healthcheck:
            test: ["CMD-SHELL", "pgrep -f \"[w]orkers/main.ts\" > /dev/null"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 15s
        networks:
            - dokploy-network
        volumes:
            - store:/usr/src/app/store
            - logs:/usr/src/app/logs
        deploy:
            replicas: 1
        restart: always
        depends_on:
            migrate:
                condition: service_completed_successfully

    # One-shot, never started with the stack. The migration/seed toolchain needs the
    # full dependency tree (see the tools stage in the Dockerfile), so it ships as its
    # own image and is run on demand:
    #
    #   docker compose -f docker-compose.prod.yml --profile tools run --rm tools npm run dobbelOmega:run
    #
    # The image has no default command, so the job must be named: DobbelOmega resets the whole
    # database, and a bare `run tools` only opens a node prompt.
    tools:
        extends:
            file: docker-compose.base.yml
            service: omegaweb-next
        build:
            target: tools
        profiles:
            - tools
        healthcheck:
            disable: true
        networks:
            - dokploy-network
        volumes:
            - store:/usr/src/app/store
            - logs:/usr/src/app/logs
            - dobbelOmegaManifest:/usr/src/app/dobbelOmegaManifest
        restart: "no"

    # Local database for github actions.
    db:
        extends:
            file: docker-compose.base.yml
            service: db
        profiles:
            - localdb
        networks:
            - dokploy-network
        restart: always
        volumes:
            - proddb:/var/lib/postgresql/data

networks:
    dokploy-network:
        external: true

volumes:
    proddb:
        driver: local
    store:
        driver: local
    logs:
        driver: local
    dobbelOmegaManifest:
        driver: local
