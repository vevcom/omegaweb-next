name: migrations

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  migrations:
    runs-on: ubuntu-latest

    env:
      DB_URI: postgresql://user:password@localhost:5432/devdb
      SHADOW_DB_URI: postgresql://user:password@localhost:5432/shadowdb

    steps:
    - name: checkout
      uses: actions/checkout@v3

    # The test stack's database, so the version under test is the one deploy/base/postgres.env names.
    - name: database
      run: docker compose --env-file .env.default --env-file deploy/base/postgres.env -f docker-compose.test.yml up -d --wait db

    - name: set up node
      uses: actions/setup-node@v3
      with:
        node-version: '24.12.x'

    - name: install dependencies
      run: npm ci

    - name: create shadow database
      run: PGPASSWORD=password psql -h localhost -U user -d devdb -c 'CREATE DATABASE shadowdb;'

    - name: migrations apply to an empty database
      run: npx prisma migrate deploy

    - name: schema matches the migration history
      run: |
        npx prisma migrate diff \
          --from-migrations ./src/prisma/migrations \
          --to-schema ./src/prisma/schema \
          --exit-code
