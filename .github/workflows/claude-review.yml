name: claude review

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    # Only branches in this repo, which takes write access to push, so never a fork's PR.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: review
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
        prompt: |
          REPO: ${{ github.repository }}
          PR NUMBER: ${{ github.event.pull_request.number }}

          Review this pull request. The PR branch is checked out in the working directory.
          Look for bugs, security holes and breaks with the rules in CLAUDE.md.
          Only report what you are confident is a real problem. Skip style nits and praise.
          Use inline comments for specific lines and one short top-level comment as a summary.
        claude_args: |
          --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

    # Temporary, to see why the first runs failed.
    - name: review error
      if: failure()
      run: jq -r '.[] | select(.type == "result" or .type == "assistant") | (.result // (.message.content[]?.text))' "$RUNNER_TEMP/claude-execution-output.json"

    - name: key check
      if: always()
      env:
        KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        echo "key length ${#KEY}"
        curl -s https://api.anthropic.com/v1/messages -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" -d '{"model":"claude-opus-5-5","max_tokens":8,"messages":[{"role":"user","content":"hi"}]}' | jq -c '{type, error, model}'
        try() { echo "$1: $(curl -s https://api.anthropic.com/v1/messages -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" "${@:3}" -d "$2" | jq -c '{type, error}')"; }
        try big-max-tokens '{"model":"claude-opus-5-5","max_tokens":32000,"messages":[{"role":"user","content":"hi"}]}'
        try haiku '{"model":"claude-haiku-5-5","max_tokens":8,"messages":[{"role":"user","content":"hi"}]}'
        try sonnet '{"model":"claude-sonnet-5-5","max_tokens":8,"messages":[{"role":"user","content":"hi"}]}'
        try cc-beta '{"model":"claude-opus-5-5","max_tokens":8,"messages":[{"role":"user","content":"hi"}]}' -H "anthropic-beta: claude-code-20250219" -H "user-agent: claude-cli/2.0.0 (external, cli)" -H "x-app: cli"
        try bearer '{"model":"claude-opus-5-5","max_tokens":8,"messages":[{"role":"user","content":"hi"}]}' -H "authorization: Bearer $KEY"
