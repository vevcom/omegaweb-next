name: claude review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

jobs:
  review:
    # Only branches in this repo, which takes write access to push, so never a fork's PR.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: install claude
      run: curl -fsSL https://claude.ai/install.sh | bash

    # Runs the CLI and not anthropics/claude-code-action, whose calls our API credits do not cover.
    - name: review
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        ~/.local/bin/claude -p "Review pull request $PR of $GITHUB_REPOSITORY. Its branch is checked out in the working directory.
        Look for bugs, security holes and breaks with the rules in CLAUDE.md.
        Only report what you are confident is a real problem. Skip style nits and praise.
        Post the review as one comment with gh pr comment, naming the file and line of each finding.
        Say so in one line when you find nothing." \
          --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
