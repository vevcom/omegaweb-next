name: release

# Publishing a GitHub release builds and pushes both images under the release tag, then opens a
# pull request on vivat that points its omegaweb overlay at the release. Merging that pull request
# is the deploy: Argo CD syncs vivat's main. See deploy/README.md.
on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  # npm ci runs the install scripts of every dependency, so it runs here, away from the token that pushes images.
  versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: set up node
      uses: actions/setup-node@v4
      with:
        node-version: '24.12.x'
        cache: npm
    - name: install dependencies
      run: |
        npm ci
        npx prisma generate
    # Nothing persists between builds, so each one bakes every release.
    - name: bake the versions
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: npm run versions:bake -- "$REPOSITORY" "$SERVER_URL" "$RELEASE_TAG" versions
    - uses: actions/upload-artifact@v4
      with:
        name: versions
        path: versions
        if-no-files-found: error
        retention-days: 1

  images:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: prod
            image: ghcr.io/vevcom/omegaweb-next
          - target: tools
            image: ghcr.io/vevcom/omegaweb-next-tools
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: download the versions
      if: matrix.target == 'prod'
      uses: actions/download-artifact@v4
      with:
        name: versions
        path: versions
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # The server actions key ends up inside the prod image, so both packages must stay private.
    - uses: docker/build-push-action@v6
      with:
        context: .
        target: ${{ matrix.target }}
        push: true
        tags: ${{ matrix.image }}:${{ github.event.release.tag_name }}
        build-args: |
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        cache-from: type=gha,scope=${{ matrix.target }}
        cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # A pre-release only publishes images, for trying by hand.
  bump:
    needs: images
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
    # The default token cannot write to another repo, and GitHub starts no workflows for a pull
    # request made with it, so the checks vivat requires would never report. The deploy app is a
    # GitHub App on the vevcom org installed on vivat, see deploy/README.md.
    - uses: actions/create-github-app-token@v2
      id: token
      with:
        app-id: ${{ vars.DEPLOY_APP_ID }}
        private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
        owner: vevcom
        repositories: vivat
    - name: checkout vivat
      uses: actions/checkout@v4
      with:
        repository: vevcom/vivat
        token: ${{ steps.token.outputs.token }}
        persist-credentials: false
    # The overlay pulls deploy/base from here at the tag and sets both images to it: three places.
    - name: point prod at the release
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        file=clusters/prod/omegaweb/kustomization.yaml
        # The tag goes into a sed replacement, so it holds nothing sed or a path would read as its own.
        if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^[A-Za-z0-9._-]+$'; then
          echo "The release tag '$RELEASE_TAG' has characters other than letters, digits, '.', '_' and '-'"
          exit 1
        fi
        sed -i -E \
          -e "s#(github\.com/vevcom/omegaweb-next//deploy/base\?ref=)[^[:space:]]+#\1$RELEASE_TAG#" \
          -e "s#^([[:space:]]*newTag: ).*#\1$RELEASE_TAG#" \
          "$file"
        [ "$(grep -cF "$RELEASE_TAG" "$file")" = 3 ]
        git diff
    - uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ steps.token.outputs.token }}
        branch: deploy/omegaweb-${{ github.event.release.tag_name }}
        commit-message: "deploy(omegaweb): ${{ github.event.release.tag_name }} to prod"
        title: "deploy(omegaweb): ${{ github.event.release.tag_name }} to prod"
        body: Merging this deploys ${{ github.event.release.html_url }} through Argo CD.
