name: release

# Publishing a GitHub release builds and pushes both images under the release tag, then opens a
# pull request on vivat that points its omegaweb overlay at the release. Merging that pull request
# is the deploy: Argo CD syncs vivat's main. See deploy/README.md.
on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: prod
            image: ghcr.io/vevcom/omegaweb-next
          - target: tools
            image: ghcr.io/vevcom/omegaweb-next-tools
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # The server actions key ends up inside the prod image, so both packages must stay private.
    - uses: docker/build-push-action@v6
      with:
        context: .
        target: ${{ matrix.target }}
        push: true
        tags: ${{ matrix.image }}:${{ github.event.release.tag_name }}
        build-args: |
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        cache-from: type=gha,scope=${{ matrix.target }}
        cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # A pre-release only publishes images, for trying by hand.
  bump:
    needs: images
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
    # The default token cannot write to another repo, and GitHub starts no workflows for a pull
    # request made with it, so the checks vivat requires would never report. The deploy app is a
    # GitHub App on the vevcom org installed on vivat, see deploy/README.md.
    - uses: actions/create-github-app-token@v2
      id: token
      with:
        app-id: ${{ vars.DEPLOY_APP_ID }}
        private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
        owner: vevcom
        repositories: vivat
    - name: checkout vivat
      uses: actions/checkout@v4
      with:
        repository: vevcom/vivat
        token: ${{ steps.token.outputs.token }}
        persist-credentials: false
    # The overlay pulls deploy/base from here at the tag and sets both images to it: three places.
    - name: point prod at the release
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        file=clusters/prod/omegaweb/kustomization.yaml
        sed -i -E \
          -e "s#(github\.com/vevcom/omegaweb-next//deploy/base\?ref=)[^[:space:]]+#\1$RELEASE_TAG#" \
          -e "s#^([[:space:]]*newTag: ).*#\1$RELEASE_TAG#" \
          "$file"
        [ "$(grep -c "$RELEASE_TAG" "$file")" = 3 ]
        git diff
    - uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ steps.token.outputs.token }}
        branch: deploy/omegaweb-${{ github.event.release.tag_name }}
        commit-message: "deploy(omegaweb): ${{ github.event.release.tag_name }} to prod"
        title: "deploy(omegaweb): ${{ github.event.release.tag_name }} to prod"
        body: Merging this deploys ${{ github.event.release.html_url }} through Argo CD.
