name: release

# Publishing a GitHub release builds and pushes both images under the release tag,
# then opens a pull request that points the prod overlay at them. Merging that pull
# request is the deploy: Argo CD syncs main.
on:
  release:
    types: [ published ]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: prod
            image: ghcr.io/vevcom/omegaweb-next
          - target: tools
            image: ghcr.io/vevcom/omegaweb-next-tools
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # The server actions key ends up inside the prod image, so both packages must stay private.
    - uses: docker/build-push-action@v6
      with:
        context: .
        target: ${{ matrix.target }}
        push: true
        tags: ${{ matrix.image }}:${{ github.event.release.tag_name }}
        build-args: |
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        cache-from: type=gha,scope=${{ matrix.target }}
        cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  bump:
    needs: images
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        ref: main
    - name: point prod at the release
      working-directory: deploy/overlays/prod
      run: |
        kustomize edit set image \
          projectnext=ghcr.io/vevcom/omegaweb-next:${{ github.event.release.tag_name }} \
          projectnext-tools=ghcr.io/vevcom/omegaweb-next-tools:${{ github.event.release.tag_name }}
    - uses: peter-evans/create-pull-request@v7
      with:
        branch: deploy/${{ github.event.release.tag_name }}
        commit-message: "deploy: ${{ github.event.release.tag_name }} to prod"
        title: "deploy: ${{ github.event.release.tag_name }} to prod"
        body: Merging this deploys ${{ github.event.release.html_url }} through Argo CD.
