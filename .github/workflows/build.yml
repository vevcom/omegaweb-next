name: build

# Builds the two production images on every change, the way release.yml does when a release is
# published, so a change that breaks the build fails here first. Nothing is pushed.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [ prod, tools ]
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    # The build bakes the server actions key in, and any value does for an image nothing runs, so
    # a pull request needs no secret. The Stripe key is the development one.
    - name: build arguments
      run: |
        echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
        grep '^NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=' .env.default >> "$GITHUB_ENV"
    - uses: docker/build-push-action@v6
      with:
        context: .
        target: ${{ matrix.target }}
        push: false
        build-args: |
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${{ env.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        cache-from: type=gha,scope=ci-${{ matrix.target }}
        cache-to: type=gha,mode=max,scope=ci-${{ matrix.target }}
