services:
    omegaweb-next:
        extends:
            file: docker-compose.base.yml
            service: omegaweb-next
        build:
            target: test
        tty: true # Allows for colorized output
        environment:
            CI: ${CI:-}
        volumes:
            - ${PROJECT_ROOT:-.}/src:/usr/src/app/src
            - ${PROJECT_ROOT:-.}/tests:/usr/src/app/tests
        # The tests of the shared cache in Redis run against it.
        depends_on:
            redis:
                condition: service_healthy

    redis:
        extends:
            file: docker-compose.base.yml
            service: redis
    
    db:
        extends:
            file: docker-compose.base.yml
            service: db
        # Increase max connections to allow for many tests to be run in parallel.
        command: ["postgres", "-c", "max_connections=300"]
        ports:
            - 5432:5432
